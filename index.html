<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Georgia, serif;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    #musicButton {
        position: fixed;
        left: 50%;
        bottom: 35px;
        transform: translateX(-50%);
        z-index: 10;

        border: 1px solid rgba(255,255,255,.5);
        background: rgba(20,20,40,.75);
        color: white;

        padding: 13px 25px;
        border-radius: 30px;

        font-size: 16px;
        cursor: pointer;

        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(30,144,255,.4);

        transition: .3s;
    }

    #musicButton:hover {
        transform: translateX(-50%) scale(1.08);
        box-shadow: 0 0 30px rgba(30,144,255,.8);
    }

    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 18px;
        z-index: 20;
        background: black;
        transition: opacity 1s;
    }
</style>
</head>

<body>

<div id="loading">
    Preparando algo especial... ❤️
</div>

<canvas id="canvas"></canvas>

<button id="musicButton">
    ▶ Reproducir música
</button>

<audio id="music" loop preload="auto">
    <source src="love_you.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");
const loading = document.getElementById("loading");

let W;
let H;

let particles = [];
let frame = 0;

const words = [
    "love you",
    "Love You",
    "LOVE YOU"
];

const colors = [
    "rgb(70,130,180)",
    "rgb(30,144,255)",
    "rgb(0,191,255)",
    "rgb(100,149,237)",
    "rgb(65,105,225)"
];

function resize() {

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    createParticles();
}

window.addEventListener("resize", resize);


/* =========================
   CORAZÓN MATEMÁTICO
========================= */

function heartXY(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: -y
    };
}


/* =========================
   CREAR PARTÍCULAS
========================= */

function createParticles() {

    particles = [];

    const scale = Math.min(
        window.innerWidth,
        window.innerHeight
    ) / 38;

    /*
       CONTORNO
    */

    const outlineCount = 150;

    for (let i = 0; i < outlineCount; i++) {

        const t =
            (i / outlineCount) *
            Math.PI * 2;

        const point = heartXY(t);

        particles.push({

            x: point.x * scale +
                window.innerWidth / 2,

            y: point.y * scale +
                window.innerHeight / 2,

            word:
                words[
                    Math.floor(
                        Math.random() * words.length
                    )
                ],

            color:
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ],

            size:
                13 + Math.random() * 6,

            alpha: 0,

            delay: i * 2,

            flicker:
                Math.random() * Math.PI * 2

        });
    }


    /*
       RELLENO
    */

    const fillCount = 120;

    for (let i = 0; i < fillCount; i++) {

        const t =
            Math.random() *
            Math.PI * 2;

        const r =
            Math.random() * 0.85;

        const point = heartXY(t);

        particles.push({

            x:
                point.x * r * scale +
                window.innerWidth / 2,

            y:
                point.y * r * scale +
                window.innerHeight / 2,

            word:
                words[
                    Math.floor(
                        Math.random() * words.length
                    )
                ],

            color:
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ],

            size:
                11 + Math.random() * 5,

            alpha: 0,

            delay:
                350 + Math.random() * 260,

            flicker:
                Math.random() * Math.PI * 2

        });
    }
}


/* =========================
   DIBUJAR PARTÍCULA
========================= */

function drawParticle(p) {

    if (frame < p.delay)
        return;

    if (p.alpha < 1) {

        p.alpha += 0.035;

        if (p.alpha > 1)
            p.alpha = 1;
    }

    let flicker =
        0.75 +
        0.25 *
        Math.sin(
            frame * 0.04 +
            p.flicker
        );

    let alpha =
        p.alpha * flicker;


    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.font =
        "bold " +
        p.size +
        "px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    /*
       BRILLO GRANDE
    */

    ctx.shadowBlur = 25;
    ctx.shadowColor = p.color;

    ctx.fillStyle = p.color;

    ctx.fillText(
        p.word,
        p.x,
        p.y
    );


    /*
       SEGUNDO BRILLO
    */

    ctx.shadowBlur = 10;

    ctx.fillText(
        p.word,
        p.x,
        p.y
    );

    ctx.restore();
}


/* =========================
   TEXTO CENTRAL
========================= */

function drawCenterText() {

    if (frame < 700)
        return;

    let progress =
        Math.min(
            1,
            (frame - 700) / 100
        );

    let alpha =
        1 -
        Math.exp(
            -progress * 8
        );

    let pulse =
        1 +
        0.025 *
        Math.sin(frame * 0.05);

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.translate(
        window.innerWidth / 2,
        window.innerHeight / 2
    );

    ctx.scale(
        pulse,
        pulse
    );


    /*
       BRILLO
    */

    ctx.shadowBlur = 45;
    ctx.shadowColor =
        "rgba(30,144,255,0.9)";

    ctx.fillStyle =
        "rgb(255,250,245)";

    ctx.font =
        "bold 54px Georgia";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "Love You",
        0,
        0
    );

    ctx.restore();
}


/* =========================
   ANIMACIÓN
========================= */

function animate() {

    frame++;

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    for (const particle of particles) {

        drawParticle(particle);

    }


    drawCenterText();

    requestAnimationFrame(animate);
}


/* =========================
   MÚSICA
========================= */

musicButton.addEventListener(
    "click",
    async () => {

        try {

            if (music.paused) {

                await music.play();

                musicButton.textContent =
                    "🔊 Música reproduciéndose";

            } else {

                music.pause();

                musicButton.textContent =
                    "▶ Reproducir música";
            }

        } catch (error) {

            alert(
                "No se pudo reproducir la música. " +
                "Comprueba que love_you.mp3 esté en el repositorio."
            );

        }

    }
);


/* =========================
   INICIO
========================= */

resize();

setTimeout(() => {

    loading.style.opacity = "0";

    setTimeout(() => {

        loading.remove();

    }, 1000);

}, 1500);

animate();

</script>

</body>
</html>
